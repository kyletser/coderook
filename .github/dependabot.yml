version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: ["dependencies", "python"]

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      vscode-dependencies:
        patterns: ["*"]
    labels: ["dependencies", "vscode"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      web-dependencies:
        patterns: ["*"]
    labels: ["dependencies", "web"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
