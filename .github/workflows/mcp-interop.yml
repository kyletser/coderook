name: Official MCP compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-sdk:
    name: MCP SDK 2.0 / stdio + SSE + HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Run pinned official SDK matrix
        run: >-
          uv run --no-sync python scripts/run_mcp_official_interop.py
          --output-dir .interop-results/mcp
      - uses: actions/upload-artifact@v7
        with:
          name: mcp-official-interop
          path: .interop-results/mcp/*
          if-no-files-found: error
