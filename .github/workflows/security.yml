name: Security

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-boundary:
    name: Sandbox boundary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Probe actual sandbox boundary
        run: >-
          uv run python scripts/check_sandbox_boundary.py
          --output reports/sandbox-boundary-${{ runner.os }}.json
      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-boundary-${{ runner.os }}
          path: reports/sandbox-boundary-${{ runner.os }}.json
          if-no-files-found: error

  secret-scan:
    name: Secret history scan
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL / ${{ matrix.language }}
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  required-security-gate:
    name: Required security gate
    needs: [sandbox-boundary, secret-scan, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all applicable security jobs to pass
        env:
          ACTOR: ${{ github.actor }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SANDBOX_RESULT: ${{ needs.sandbox-boundary.result }}
        run: |
          if [[ "${ACTOR}" = "dependabot[bot]" ]]; then
            test "${SECRET_SCAN_RESULT}" = "skipped"
            test "${CODEQL_RESULT}" = "skipped"
            exit 0
          fi
          test "${SECRET_SCAN_RESULT}" = "success"
          test "${CODEQL_RESULT}" = "success"
          test "${SANDBOX_RESULT}" = "success"
