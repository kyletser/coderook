name: Remote release evidence

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Audit remote release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Audit workflows and active branch rulesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python scripts/audit_github_release_evidence.py
          --repo "$GITHUB_REPOSITORY"
          --output reports/github-release-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: github-release-evidence
          path: reports/github-release-evidence.json
          if-no-files-found: warn
