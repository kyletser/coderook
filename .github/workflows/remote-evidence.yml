name: Remote release evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  actions: read
  contents: read

jobs:
  audit:
    name: Audit remote release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Audit workflows and active branch rulesets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          uv run python scripts/audit_github_release_evidence.py
          --repo "$GITHUB_REPOSITORY"
          --output reports/github-release-evidence.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: github-release-evidence
          path: reports/github-release-evidence.json
          if-no-files-found: warn
