name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required Ubuntu gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web typecheck and static build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Web bundle is committed
        run: git diff --exit-code -- src/code_rook/web/static

      - name: Ruff
        run: uv run ruff check .

      - name: Brand contract
        run: uv run python scripts/check_brand.py

      - name: Public repository contract
        run: uv run python scripts/check_public_repo.py

      - name: Mypy
        run: uv run mypy src

      - name: Fast unit tests
        run: uv run pytest -q tests/unit

      - name: Critical daemon smoke
        run: >-
          uv run pytest -q
          tests/integration/test_ping_roundtrip.py
          tests/integration/test_s4_session_ipc.py

      - name: Protocol contract
        run: uv run python scripts/gen_protocol_doc.py --check

      - name: Build wheel
        run: uv build

      - name: Installed-wheel smoke
        run: uv run python scripts/smoke_wheel.py dist
