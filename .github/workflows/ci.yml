name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-package:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Ruff
        run: uv run ruff check .

      - name: Brand contract
        run: uv run python scripts/check_brand.py

      - name: Public repository contract
        run: uv run python scripts/check_public_repo.py

      - name: Mypy strict
        run: uv run mypy src

      - name: Mypy Linux contract
        if: runner.os == 'Windows'
        run: uv run mypy --platform linux src

      - name: Tests
        run: uv run pytest -q

      - name: Deterministic benchmark contract
        run: uv run python scripts/run_benchmark.py --suite quick --validate-baseline

      - name: Sandbox negative boundary
        run: uv run python scripts/check_sandbox_boundary.py

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Package VS Code extension
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        run: npm ci && npm run check && npm run package

      - name: Protocol contract
        run: uv run python scripts/gen_protocol_doc.py --check

      - name: Build wheel and sdist
        run: uv build

      - name: Installed-wheel smoke
        run: uv run python scripts/smoke_wheel.py dist

      - uses: actions/upload-artifact@v4
        with:
          name: coderook-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: coderook-vscode
          path: editors/vscode/dist/*.vsix
          if-no-files-found: error
