name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribution-gate:
    uses: ./.github/workflows/distribution.yml

  validate:
    name: Version and complete quality contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Match tag, packages, protocols and changelog
        run: >-
          uv run python scripts/check_release_contract.py
          --tag "${GITHUB_REF_NAME}"
          --require-go
      - name: Complete repository gate
        run: make verify

  container:
    name: Publish and attest GHCR image
    needs: [distribution-gate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
      - run: mkdir -p container-metadata
      - name: Generate container SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: container-metadata/coderook-container.spdx.json
          artifact-name: coderook-container-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Record immutable container reference
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p container-metadata
          python - <<'PY'
          import json, os, pathlib
          payload = {
              "schema_version": 1,
              "image": os.environ["IMAGE"],
              "tag": os.environ["GITHUB_REF_NAME"],
              "digest": os.environ["IMAGE_DIGEST"],
          }
          pathlib.Path("container-metadata/container-image.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Keyless-sign container digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"
      - name: Attest container provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest container SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: container-metadata/coderook-container.spdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@v6
        with:
          name: coderook-container
          path: container-metadata/*
          if-no-files-found: error

  release:
    name: Sign and publish GitHub Release assets
    needs: [distribution-gate, validate, container]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/download-artifact@v7
        with:
          name: wheel-ubuntu-latest
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: coderook-windows-portable
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: coderook-vscode
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: coderook-container
          path: release
      - name: Write release/protocol contract
        run: >-
          uv run python scripts/check_release_contract.py
          --tag "${GITHUB_REF_NAME}"
          --require-go
          --output release/release-contract.json
      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Generate SPDX SBOM for every downloadable package
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          shopt -s nullglob
          artifacts=(release/*.whl release/*.tar.gz release/*.zip release/*.vsix)
          test "${#artifacts[@]}" -eq 4
          for artifact in "${artifacts[@]}"; do
            "${SYFT}" scan "${artifact}" -o "spdx-json=${artifact}.spdx.json"
          done
      - name: Generate release manifest and checksums
        run: >-
          uv run python scripts/generate_release_manifest.py
          --input release
          --version "${GITHUB_REF_NAME#v}"
      - name: Attest every checksummed release asset
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS
          create-storage-record: false
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Keyless-sign and verify SHA256SUMS
        run: |
          cosign sign-blob --yes release/SHA256SUMS \
            --bundle release/SHA256SUMS.sigstore.json
          cosign verify-blob release/SHA256SUMS \
            --bundle release/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=("${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "CodeRook ${GITHUB_REF_NAME}")
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}" release/*
