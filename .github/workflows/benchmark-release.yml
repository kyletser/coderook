name: Release benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
        route:
          - anthropic_messages
          - openai_responses
        include:
          - route: anthropic_messages
            provider: anthropic
            model: CODEROOK_BENCH_ANTHROPIC_MODEL
            base_url: CODEROOK_BENCH_ANTHROPIC_BASE_URL
            secret: CODEROOK_BENCH_ANTHROPIC_KEY
          - route: openai_responses
            provider: openai
            model: CODEROOK_BENCH_OPENAI_MODEL
            base_url: CODEROOK_BENCH_OPENAI_BASE_URL
            secret: CODEROOK_BENCH_OPENAI_KEY
    env:
      CODEROOK_LLM_PROVIDER: ${{ matrix.provider }}
      CODEROOK_LLM_DEFAULT_MODEL: ${{ vars[matrix.model] }}
      CODEROOK_LLM_BASE_URL: ${{ vars[matrix.base_url] }}
      CODEROOK_LLM_API_KEY_ENV: CODEROOK_RELEASE_API_KEY
      CODEROOK_RELEASE_API_KEY: ${{ secrets[matrix.secret] }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Require explicit release route
        run: |
          test -n "$CODEROOK_LLM_DEFAULT_MODEL"
          test -n "$CODEROOK_RELEASE_API_KEY"
      - name: Run candidate suite
        run: >-
          uv run python scripts/run_benchmark.py --suite release
          --report-only
          --output .benchmark-results/${{ matrix.route }}-${{ matrix.repeat }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ matrix.route }}-${{ matrix.repeat }}
          path: .benchmark-results/${{ matrix.route }}-${{ matrix.repeat }}
          if-no-files-found: warn

  aggregate:
    name: Aggregate 2 wire formats x 2 repeats
    needs: [benchmark]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: .benchmark-results/raw
      - name: Build evidence-bound optimization backlog
        run: >-
          uv run python scripts/benchmark_optimization.py plan
          --input-root .benchmark-results/raw
          --output .benchmark-results/aggregate
      - name: Enforce aggregate release thresholds
        run: >-
          uv run python scripts/aggregate_benchmark_reports.py
          --input-root .benchmark-results/raw
          --output .benchmark-results/aggregate
          --expected-groups 2
          --expected-repeats 2
          --expected-wire-formats 2
          --min-overall-pass-rate 0.80
          --min-multi-file-pass-rate 0.75
          --min-read-only-pass-rate 0.90
          --min-security-pass-rate 1.0
          --max-pass-rate-spread 0.10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-release-aggregate
          path: .benchmark-results/aggregate/*
          if-no-files-found: warn
