name: Distribution gate

on:
  workflow_call:
    inputs:
      baseline_ref:
        description: Immutable baseline commit or release tag for upgrade preflight
        required: false
        default: 8cb9e1e421f16a246908c4d1b69840036a35237d
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: Run the full distribution gate or one focused job
        required: true
        default: all
        type: choice
        options:
          - all
          - wheel
          - container
          - windows-portable
          - vscode
          - upgrade
      baseline_ref:
        description: Immutable baseline commit or release tag for upgrade preflight
        required: true
        default: 8cb9e1e421f16a246908c4d1b69840036a35237d
        type: string

permissions:
  contents: read

jobs:
  wheel:
    name: Clean wheel smoke / ${{ matrix.os }}
    if: github.event_name == 'workflow_call' || inputs.target == 'all' || inputs.target == 'wheel'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv build
      - run: uv run python scripts/smoke_wheel.py dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  container:
    name: Docker clean-image smoke
    if: github.event_name == 'workflow_call' || inputs.target == 'all' || inputs.target == 'container'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag coderook:candidate .
      - run: docker run --rm coderook:candidate coderook --version
      - name: Container zero-credential Core, ping and TUI smoke
        run: >-
          docker run --rm
          --volume "$PWD/scripts/smoke_installed_runtime.py:/tmp/coderook-smoke.py:ro"
          coderook:candidate
          python /tmp/coderook-smoke.py

  windows-portable:
    name: Windows portable smoke
    if: github.event_name == 'workflow_call' || inputs.target == 'all' || inputs.target == 'windows-portable'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - shell: pwsh
        run: ./scripts/build_windows_portable.ps1
      - shell: pwsh
        run: ./dist/coderook-windows-portable/portable-coderook.cmd --version
      - name: Portable zero-credential Core, ping and TUI smoke
        shell: pwsh
        run: >-
          ./dist/coderook-windows-portable/runtime/python.exe
          ./scripts/smoke_installed_runtime.py
      - uses: actions/upload-artifact@v6
        with:
          name: coderook-windows-portable
          path: dist/coderook-windows-portable.zip
          if-no-files-found: error

  vscode:
    name: VS Code VSIX and Extension Host smoke
    if: github.event_name == 'workflow_call' || inputs.target == 'all' || inputs.target == 'vscode'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - working-directory: editors/vscode
        run: npm ci
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y imagemagick xdotool xvfb
      - name: Real daemon Extension Host smoke
        run: >-
          uv run python scripts/run_vscode_extension_host_smoke.py
          --headless
          --evidence artifacts/vscode-extension-host.json
          --screenshot artifacts/vscode-approval.png
      - working-directory: editors/vscode
        run: npm run check && npm run package
      - uses: actions/upload-artifact@v6
        with:
          name: coderook-vscode
          path: |
            editors/vscode/dist/*.vsix
            artifacts/vscode-extension-host.json
            artifacts/vscode-approval.png
          if-no-files-found: error

  upgrade:
    name: Installed upgrade and rollback / ${{ matrix.os }}
    if: github.event_name == 'workflow_call' || inputs.target == 'all' || inputs.target == 'upgrade'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Build baseline and candidate, upgrade state, then restore rollback backup
        run: >-
          uv run python scripts/run_upgrade_preflight.py
          --baseline-ref "${{ inputs.baseline_ref }}"
          --evidence "artifacts/upgrade-preflight-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v6
        with:
          name: upgrade-preflight-${{ runner.os }}
          path: artifacts/upgrade-preflight-${{ runner.os }}.json
          if-no-files-found: error

  upgrade-aggregate:
    name: Required upgrade preflight gate
    needs: [upgrade]
    if: >-
      always() &&
      (github.event_name == 'workflow_call' || inputs.target == 'all' || inputs.target == 'upgrade')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every platform job to pass
        env:
          UPGRADE_RESULT: ${{ needs.upgrade.result }}
        run: test "${UPGRADE_RESULT}" = "success"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: upgrade-preflight-*
          path: upgrade-reports
          merge-multiple: true
      - name: Validate cross-platform identity and rollback invariants
        run: >-
          python scripts/validate_upgrade_preflight_reports.py
          upgrade-reports/*.json
          --expected-commit "${GITHUB_SHA}"
          --expected-baseline-ref "${{ inputs.baseline_ref }}"
          --output-dir artifacts/upgrade-preflight-aggregate
      - uses: actions/upload-artifact@v6
        with:
          name: upgrade-preflight-aggregate
          path: artifacts/upgrade-preflight-aggregate/*
          if-no-files-found: error
