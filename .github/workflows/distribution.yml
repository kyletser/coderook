name: Distribution gate

on:
  workflow_call:
    inputs:
      target:
        description: Run the full distribution gate or one focused job
        required: false
        default: all
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: Run the full distribution gate or one focused job
        required: true
        default: all
        type: choice
        options:
          - all
          - wheel
          - container
          - portable
          - vscode

permissions:
  contents: read

jobs:
  wheel:
    name: Clean wheel smoke / ${{ matrix.os }}
    if: inputs.target == 'all' || inputs.target == 'wheel'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv build
      - run: uv run python scripts/smoke_wheel.py dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  container:
    name: Docker clean-image smoke
    if: inputs.target == 'all' || inputs.target == 'container'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag coderook:candidate .
      - run: docker run --rm coderook:candidate coderook --version
      - name: Container zero-credential Core, ping and TUI smoke
        run: >-
          docker run --rm
          --volume "$PWD/scripts/smoke_installed_runtime.py:/tmp/coderook-smoke.py:ro"
          coderook:candidate
          python /tmp/coderook-smoke.py

  portable:
    name: Self-contained ${{ matrix.target }} smoke
    if: inputs.target == 'all' || inputs.target == 'portable'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            archive: coderook-windows-x86_64.zip
          - os: ubuntu-latest
            target: linux-x86_64
            archive: coderook-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: linux-arm64
            archive: coderook-linux-arm64.tar.gz
          - os: macos-13
            target: macos-x86_64
            archive: coderook-macos-x86_64.tar.gz
          - os: macos-14
            target: macos-arm64
            archive: coderook-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - name: Build controlled CPython runtime package
        run: uv run python scripts/build_portable.py --target ${{ matrix.target }}
      - name: Portable version smoke / Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dist/coderook-${{ matrix.target }}/coderook.cmd --version
      - name: Portable version smoke / POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: ./dist/coderook-${{ matrix.target }}/coderook --version
      - name: Portable zero-credential Core, ping and TUI smoke / Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./dist/coderook-${{ matrix.target }}/runtime/python.exe
          ./scripts/smoke_installed_runtime.py
      - name: Portable zero-credential Core, ping and TUI smoke / POSIX
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          ./dist/coderook-${{ matrix.target }}/runtime/bin/python3.12
          ./scripts/smoke_installed_runtime.py
      - uses: actions/upload-artifact@v6
        with:
          name: coderook-portable-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  vscode:
    name: VS Code VSIX and Extension Host smoke
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'vscode'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - working-directory: editors/vscode
        run: npm ci
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y imagemagick xdotool xvfb
      - name: Real daemon Extension Host smoke
        run: >-
          uv run python scripts/run_vscode_extension_host_smoke.py
          --headless
          --evidence artifacts/vscode-extension-host.json
          --screenshot artifacts/vscode-approval.png
      - working-directory: editors/vscode
        run: npm run check && npm run package
      - uses: actions/upload-artifact@v6
        with:
          name: coderook-vscode
          path: |
            editors/vscode/dist/*.vsix
            artifacts/vscode-extension-host.json
            artifacts/vscode-approval.png
          if-no-files-found: error
