name: Crash recovery gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daemon-crash-matrix:
    name: 100 daemon hard-kill recoveries / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Run 100 hard-kill recoveries
        run: >-
          uv run python scripts/run_crash_recovery_matrix.py
          --iterations 100
          --min-rate 0.95
          --output reports/crash-recovery.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crash-recovery-${{ matrix.os }}
          path: reports/crash-recovery.json
          if-no-files-found: error

  aggregate:
    name: Required crash recovery gate
    needs: [daemon-crash-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Download platform reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: crash-recovery-*
          path: reports/raw

      - name: Validate commit-bound three-platform aggregate
        run: >-
          uv run python scripts/validate_crash_recovery_reports.py
          --input-root reports/raw
          --commit "${{ github.sha }}"
          --iterations 100
          --min-rate 0.95
          --output reports/aggregate/crash-recovery-aggregate.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crash-recovery-aggregate
          path: reports/aggregate/crash-recovery-aggregate.json
          if-no-files-found: warn
