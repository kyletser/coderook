name: Feature request
description: 提议有明确场景和验收方式的能力改进
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景遇到了什么限制？不要只写技术名词。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明用户交互、协议/数据影响、安全边界和降级行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 目前如何绕过？为什么现有工具、MCP、Skill 或 Hook 不足？
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的完成条件
      description: 给出测试、用户结果或 benchmark 指标。
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 主要影响面
      options:
        - TUI
        - Agent loop / context
        - Tools / editing / sandbox
        - Session / runtime / recovery
        - Multi-agent / workflow
        - MCP / Skills / Hooks / SDK
        - Packaging / documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我说明了真实使用场景，而不只是要求引入某个框架。
          required: true
        - label: 我考虑了失败、权限、安全或兼容性影响。
          required: true
